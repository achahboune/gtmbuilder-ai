<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTMBuilder AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f5f5f5}
header{background:#4a90e2;color:#fff;padding:2rem;width:100%;text-align:center}
main{max-width:600px;width:100%;padding:1rem}
textarea{width:100%;height:100px;margin-top:0.5rem}
button{margin-top:0.5rem;padding:0.5rem 1rem;background:#4a90e2;color:#fff;border:none;cursor:pointer}
#result{margin-top:1rem;background:#fff;padding:1rem;border-radius:4px;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1>GTMBuilder AI</h1><p>Generate a GTM plan for your AI startup in seconds.</p></header>
<main>
<label for="prompt">Enter your startup description / goal:</label>
<textarea id="prompt" placeholder="e.g., AI‑powered image tagging SaaS for e‑commerce"></textarea>
<button id="generate">Generate Plan</button>
<div id="result"></div>
</main>
<script>
document.getElementById('generate').addEventListener('click', async () => {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const res = await fetch('/generate', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({prompt})
  });
  const data = await res.json();
  document.getElementById('result').textContent = data.plan;
});
</script>
</body>
</html>
